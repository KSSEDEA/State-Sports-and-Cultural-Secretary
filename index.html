async function toDataURLSafe(url){
  if(!url||url.startsWith("data:"))return url;
  const candidates=[
    "https://wsrv.nl/?url="+encodeURIComponent(url)+"&w=400&h=400&fit=cover&output=jpg",
    "https://images.weserv.nl/?url="+encodeURIComponent(url)+"&w=400&h=400&fit=cover&output=jpg",
    "https://corsproxy.io/?"+encodeURIComponent(url),
    url
  ];
  for(const u of candidates){
    try{
      const res=await fetch(u,{mode:"cors"});
      if(!res.ok)continue;
      const blob=await res.blob();
      if(!blob||!blob.size)continue;
      const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)});
      if(typeof dataUrl==="string"&&dataUrl.startsWith("data:image"))return dataUrl;
    }catch(e){}
  }
  return null;
}

function addImageScaled(src){
  const done=out=>{addImage(out);status("ಇಮೇಜ್ ಮಧ್ಯದ ಬಾರ್ಡರ್‌ನಲ್ಲಿ ಸೇರಿಸಲಾಗಿದೆ ✓")};

    const im=new Image();
    im.onload=()=>{
      let out=src;
      const max=1600,s=Math.min(1,max/Math.max(im.naturalWidth||1,im.naturalHeight||1));
      if(s<1){
        try{
          const c=document.createElement("canvas");
          c.width=Math.max(1,Math.round(im.naturalWidth*s));
          c.height=Math.max(1,Math.round(im.naturalHeight*s));
          const x=c.getContext("2d");
          x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);

          out=c.toDataURL("image/jpeg",.85);

      }
      done(out);
    };

    im.src=src;
  }catch(e){done(src)}
}

function bindReorderEvents(){
  const container=$("cards");if(!container||container.dataset.sortableBound==="1")return;
  container.dataset.sortableBound="1";
  container.addEventListener("pointerdown",e=>{
    const handle=e.target.closest(".move-handle");if(!handle)return;
    if(e.button!==undefined&&e.button!==0)return;
    const card=handle.closest(".card");if(!card)return;
    e.preventDefault();
    const startX=e.clientX,startY=e.clientY,pointerId=e.pointerId,touch=e.pointerType==="touch";
    let started=false,moved=false,timer=null;
    const begin=()=>{if(started)return;started=true;card.classList.add("dragging");container.classList.add("sorting");};
    if(touch)timer=setTimeout(begin,220);else begin();
    const move=ev=>{
      if(ev.pointerId!==pointerId)return;
      if(!started){
        if(Math.hypot(ev.clientX-startX,ev.clientY-startY)>9){clearTimeout(timer);cleanup(false);}
        return;
      }
      ev.preventDefault();
      const hit=document.elementFromPoint(ev.clientX,ev.clientY),target=hit&&hit.closest(".card");
      if(!target||target===card||target.parentElement!==container)return;
      const rect=target.getBoundingClientRect(),after=ev.clientX>rect.left+rect.width/2;
      if(after){if(card!==target.nextElementSibling){container.insertBefore(card,target.nextElementSibling);moved=true;}}
      else if(card!==target){container.insertBefore(card,target);moved=true;}
    };
    const cleanup=save=>{
      clearTimeout(timer);document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",cancel);
      card.classList.remove("dragging");container.classList.remove("sorting");
      if(save&&moved){syncLayout();autoSave();status("ಹುದ್ದೆಗಳ ಕ್ರಮ ಬದಲಿಸಲಾಗಿದೆ ✓");}
    };
    const up=ev=>{if(ev.pointerId===pointerId)cleanup(true);};
    const cancel=ev=>{if(ev.pointerId===pointerId)cleanup(false);};
    document.addEventListener("pointermove",move,{passive:false});
    document.addEventListener("pointerup",up);
    document.addEventListener("pointercancel",cancel);
  });
